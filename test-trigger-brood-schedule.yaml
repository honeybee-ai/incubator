name: trigger-schedule-test
provider: ollama/qwen3:8b

schedule:
  every: 2s

hive:
  default:
    agents:
      - role: worker
        type: mock
        count: 2
        mock:
          actions:
            - tool: set_state
              args: { key: "ping", value: "pong" }
    events:
      on:
        honeybee.agents.complete: spawn
      schedule:
        every: 2s
        action: spawn
